<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Sysadmin & Builder</title>
<script>
// The terminal is a desktop/keyboard experience. On phones (small + touch), skip
// straight to the responsive portfolio instead. ?noredirect=1 forces the terminal.
(function(){
  try{
    var params = new URLSearchParams(location.search);
    if (params.has('noredirect')) return;
    var coarse = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
    var narrow = Math.min(window.innerWidth, window.innerHeight) <= 768;
    var touch  = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (narrow && (coarse || touch)) {
      location.replace('portfolio.html');
    }
  }catch(e){}
})();
</script>
<style>
  :root{
    --bg:#0a0e0a; --fg:#c9ffcf; --dim:#4a6b4f; --accent:#39ff6a;
    --amber:#ffb642; --red:#ff5f56; --cyan:#5fd7ff; --violet:#c792ff;
    --scan:rgba(0,255,90,.03);
    --font:'SF Mono',ui-monospace,'Cascadia Mono','Roboto Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000}
  body{
    font-family:var(--font);
    display:flex;align-items:center;justify-content:center;
    padding:min(4vw,32px);
  }
  .crt{
    width:min(920px,100%);height:min(640px,88vh);
    background:var(--bg);border-radius:10px;
    box-shadow:0 0 0 1px #1c2a1c,0 30px 80px -20px rgba(0,255,90,.15),inset 0 0 120px rgba(0,0,0,.6);
    display:flex;flex-direction:column;overflow:hidden;position:relative;
    transition:width .9s cubic-bezier(.7,0,.2,1),height .9s cubic-bezier(.7,0,.2,1),border-radius .9s ease;
    z-index:2;
  }
  .crt.fullscreen{
    width:100vw;height:100vh;border-radius:0;
  }
  /* slide the whole terminal off to reveal the portfolio underneath */
  .crt.slide-away{
    transition:transform 1s cubic-bezier(.6,0,.2,1),opacity 1s ease;
    transform:translateX(115%) rotate(2deg);opacity:0;
  }
  /* full-page portfolio behind the terminal, revealed on close */
  #portfolioLayer{
    position:fixed;inset:0;border:0;width:100vw;height:100vh;
    z-index:1;background:#0d1117;
    opacity:0;visibility:hidden;
    transition:opacity 1s ease;
  }
  #portfolioLayer.show{visibility:visible}
  #portfolioLayer.reveal{opacity:1}
  body.gui-mode{padding:0}
  /* GUI landing shown once expanded */
  .gui-screen{
    position:absolute;inset:0;z-index:15;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:22px;
    background:radial-gradient(ellipse at 50% 30%,#0f1a10,#060a06 70%);
    opacity:0;transition:opacity .6s ease;text-align:center;padding:24px;
  }
  .gui-screen.show{display:flex;opacity:1}
  .gui-screen h1{
    margin:0;font-size:clamp(28px,6vw,56px);color:var(--fg);letter-spacing:2px;
    text-shadow:0 0 24px rgba(57,255,106,.35);
  }
  .gui-screen p{margin:0;color:var(--dim);font-size:14px;max-width:420px;line-height:1.6}
  .gui-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .gui-btn{
    padding:12px 22px;border:1px solid var(--dim);border-radius:8px;color:var(--fg);
    text-decoration:none;font-size:14px;transition:.2s;background:rgba(57,255,106,.04);
  }
  .gui-btn:hover{border-color:var(--accent);background:rgba(57,255,106,.12);box-shadow:0 0 20px rgba(57,255,106,.15)}
  .gui-btn.exit{color:var(--dim)}
  .gui-boot{color:var(--accent);font-size:14px;white-space:pre;line-height:1.6}
  .gui-frame{
    position:absolute;inset:0;width:100%;height:100%;border:0;
    opacity:0;transition:opacity .5s ease;background:#0d1117;z-index:1;
  }
  .gui-frame.ready{opacity:1}
  .gui-back{
    position:absolute;bottom:18px;right:18px;z-index:30;
    padding:10px 18px;border:1px solid var(--accent);border-radius:8px;
    background:rgba(6,10,6,.85);color:var(--fg);font:inherit;font-size:13px;
    cursor:pointer;backdrop-filter:blur(6px);transition:.2s;
    box-shadow:0 4px 20px rgba(0,0,0,.5),0 0 14px rgba(57,255,106,.12);
  }
  .gui-back:hover{background:rgba(57,255,106,.14);box-shadow:0 4px 20px rgba(0,0,0,.5),0 0 24px rgba(57,255,106,.25)}
  .crt::before{ /* scanlines */
    content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(0deg,transparent 0 2px,var(--scan) 2px 4px);
  }
  .crt::after{ /* vignette / flicker */
    content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35));
    animation:flicker 6s infinite;
  }
  @keyframes flicker{0%,97%,100%{opacity:1}98%{opacity:.85}99%{opacity:.95}}
  .bar{
    height:34px;flex:0 0 34px;display:flex;align-items:center;gap:8px;
    padding:0 12px;background:#0f160f;border-bottom:1px solid #1c2a1c;z-index:7;
  }
  .dot{width:12px;height:12px;border-radius:50%}
  .r{background:var(--red)}.y{background:var(--amber)}.g{background:var(--accent)}
  .dot.r{cursor:pointer;position:relative}
  .dot.r::after{
    content:"×";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#3a0000;opacity:0;transition:opacity .15s;line-height:1;
  }
  .dot.r:hover::after{opacity:1}
  .title{margin-left:8px;color:var(--dim);font-size:12px;letter-spacing:.5px}
  .title b{color:var(--fg)}
  .screen{
    flex:1;overflow-y:auto;padding:16px 18px 10px;color:var(--fg);
    font-size:14px;line-height:1.5;z-index:4;scrollbar-width:thin;
    scrollbar-color:var(--dim) transparent;
  }
  .screen::-webkit-scrollbar{width:8px}
  .screen::-webkit-scrollbar-thumb{background:var(--dim);border-radius:4px}
  .line{white-space:pre-wrap;word-break:break-word}
  .prompt-line{display:flex;flex-wrap:wrap;gap:0}
  .ps1{color:var(--accent);flex:0 0 auto}
  .ps1 .at{color:var(--dim)}.ps1 .host{color:var(--cyan)}.ps1 .path{color:var(--amber)}
  .input-wrap{flex:1;display:flex;min-width:60px}
  input.cmd{
    flex:1;background:transparent;border:0;outline:0;color:var(--fg);
    font:inherit;caret-color:var(--accent);padding:0 0 0 8px;
  }
  /* masked like a password field, but it's a plain text input so browsers /
     password managers (Firefox, Vaultwarden, 1Password…) don't offer to fill it */
  input.cmd.masked{-webkit-text-security:disc;text-security:disc}
  a{color:var(--cyan)}
  .dim{color:var(--dim)}.acc{color:var(--accent)}.amb{color:var(--amber)}
  .red{color:var(--red)}.vio{color:var(--violet)}.cy{color:var(--cyan)}
  .foot{
    flex:0 0 auto;padding:6px 14px;border-top:1px solid #1c2a1c;background:#0d130d;
    display:flex;justify-content:space-between;color:var(--dim);font-size:11px;z-index:7;
  }
  .blink{animation:bl 1.1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .glitch{animation:glx .25s steps(2) 3}
  @keyframes glx{0%{transform:translate(0)}25%{transform:translate(-2px,1px)}
    50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}}

  /* ---- finale ---- */
  .glitch-hard{animation:glxh .09s steps(2) infinite}
  @keyframes glxh{
    0%{transform:translate(0) skewX(0)}
    20%{transform:translate(-4px,2px) skewX(3deg);filter:hue-rotate(90deg)}
    40%{transform:translate(5px,-3px) skewX(-4deg);filter:hue-rotate(-60deg) invert(.1)}
    60%{transform:translate(-3px,1px) skewX(2deg);filter:saturate(3)}
    80%{transform:translate(4px,2px) skewX(-2deg);filter:hue-rotate(180deg)}
    100%{transform:translate(0) skewX(0)}
  }
  .screen.melt .line{animation:melt .9s ease-in forwards}
  @keyframes melt{to{transform:translateY(60vh) scaleY(1.4);opacity:0;filter:blur(3px)}}
  .whiteout{position:absolute;inset:0;background:#c9ffcf;opacity:0;z-index:20;pointer-events:none}
  .whiteout.go{animation:wo 1.1s ease-out forwards}
  @keyframes wo{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
  .glitch-txt{color:var(--red);text-shadow:2px 0 var(--cyan),-2px 0 var(--vio);letter-spacing:.5px}

  @media (prefers-reduced-motion:reduce){
    .crt::after,.blink{animation:none}
    .glitch-hard,.screen.melt .line,.whiteout.go{animation:none}
  }
  .bootline{opacity:0;animation:fadein .18s forwards}
  @keyframes fadein{to{opacity:1}}

  /* ---- tor browser overlay ---- */
  .tor-screen{
    position:fixed;inset:0;z-index:50;display:none;flex-direction:column;
    background:#15101d;opacity:0;transform:translateY(14px);
    transition:opacity .45s ease,transform .45s cubic-bezier(.6,0,.2,1);
    font-family:var(--font);
  }
  .tor-screen.show{display:flex;opacity:1;transform:none}
  .tor-chrome{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;
    background:#241a33;border-bottom:1px solid #3a2b52;
  }
  .tor-nav{display:flex;gap:4px}
  .tor-nav button{
    width:26px;height:26px;border:0;border-radius:6px;background:#2f2344;color:#b9a7d6;
    font:inherit;font-size:13px;cursor:default;opacity:.55;
  }
  .tor-addr{
    flex:1;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;min-width:0;
    background:#1b1427;border:1px solid #3a2b52;border-radius:8px;color:#c9b8e6;font-size:12px;
  }
  .tor-addr .oni{color:#c792ff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .tor-addr .lock{color:#8f6fd6;flex:0 0 auto}
  .tor-newid{
    flex:0 0 auto;border:1px solid #4a3a66;background:#2f2344;color:#c9b8e6;border-radius:8px;
    padding:6px 10px;font:inherit;font-size:11px;cursor:pointer;
  }
  .tor-newid:hover{background:#3a2b52}
  .tor-x{
    flex:0 0 auto;width:28px;height:28px;border:1px solid #4a3a66;background:#2f2344;color:#e6a0a0;
    border-radius:8px;font:inherit;font-size:14px;cursor:pointer;
  }
  .tor-x:hover{background:#3a2233}
  .tor-body{flex:1;overflow-y:auto;color:#d8ccec;position:relative;scrollbar-width:thin;scrollbar-color:#4a3a66 transparent}
  .tor-body::-webkit-scrollbar{width:9px}
  .tor-body::-webkit-scrollbar-thumb{background:#4a3a66;border-radius:4px}
  .tor-circuit{
    display:flex;gap:6px;align-items:center;padding:6px 12px;font-size:11px;color:#8f7bb0;
    background:#1b1427;border-bottom:1px solid #2b2038;flex-wrap:wrap;
  }
  .tor-circuit b{color:#9d7bd6;font-weight:600}
  /* onion page */
  .oni-wrap{max-width:760px;margin:0 auto;padding:26px 22px 60px}
  .oni-head{border-bottom:1px solid #3a2b52;padding-bottom:14px;margin-bottom:18px}
  .oni-head h1{margin:0 0 4px;font-size:20px;color:#e0d0ff;letter-spacing:.5px}
  .oni-head .sub{color:#7d6ba0;font-size:12px}
  .oni-warn{
    background:#2a1420;border:1px solid #5a2a3a;color:#ffb0b0;
    padding:8px 12px;border-radius:8px;font-size:11px;margin-bottom:16px;line-height:1.5;
  }
  /* invite gate */
  .gate{max-width:430px;margin:36px auto;text-align:center}
  .gate h2{color:#e0d0ff;font-size:16px;margin:0 0 6px}
  .gate p{color:#8f7bb0;font-size:12px;margin:0 0 16px;line-height:1.6}
  .gate-col{display:flex;flex-direction:column;gap:8px}
  .gate-row{display:flex;gap:8px}
  .gate input{
    flex:1;min-width:0;background:#1b1427;border:1px solid #3a2b52;border-radius:8px;color:#e0d0ff;
    font:inherit;font-size:13px;padding:10px 12px;outline:0;letter-spacing:1px;
  }
  .gate input:focus{border-color:#8f6fd6}
  .gate button{
    background:#3a2b52;border:1px solid #6a4fa0;color:#e0d0ff;border-radius:8px;
    padding:10px 16px;font:inherit;font-size:13px;cursor:pointer;
  }
  .gate button:hover{background:#4a3a66}
  .gate .err{color:#ff8080;font-size:12px;margin-top:12px;min-height:16px}
  .gate.shake{animation:gshake .4s}
  @keyframes gshake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  /* irc */
  .irc{display:flex;height:100%}
  .irc-main{flex:1;display:flex;flex-direction:column;min-width:0}
  .irc-topic{padding:10px 16px;border-bottom:1px solid #2b2038;color:#9d7bd6;font-size:12px;background:#1b1427}
  .irc-log{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.55;scrollbar-width:thin;scrollbar-color:#4a3a66 transparent}

  .irc-msg{word-break:break-word}
  .irc-msg .nick{color:#7d6ba0}
  .irc-msg .nick.bot{color:var(--accent)}
  .irc-msg .nick.me{color:var(--cyan)}
  .irc-msg .nick.ghost{color:var(--violet)}
  .irc-msg.sys{color:#6a5a86;font-style:italic}
  .irc-msg .amb{color:var(--amber)}
  .irc-input{display:flex;border-top:1px solid #2b2038;background:#1b1427}
  .irc-input .p{padding:10px 2px 10px 14px;color:var(--cyan);flex:0 0 auto}
  .irc-input input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#e0d0ff;font:inherit;font-size:13px;padding:10px 12px 10px 6px}
  .irc-users{
    flex:0 0 132px;border-left:1px solid #2b2038;padding:10px 12px;background:#180f24;font-size:12px;color:#8f7bb0;

  .irc-users div{padding:2px 0}
  .irc-users .bot{color:var(--accent)}.irc-users .me{color:var(--cyan)}.irc-users .ghost{color:var(--violet)}

  /* tab strip + window chrome */
  .tor-tabs{display:flex;align-items:center;gap:4px;padding:6px 8px 0;background:#1a1226;border-bottom:1px solid #2b2038}
  .tor-tab{display:flex;align-items:center;gap:8px;max-width:250px;padding:7px 10px;font-size:12px;color:#d8ccec;

  .tor-winctl{margin-left:auto;display:flex;gap:2px}
  .tor-winctl span{width:30px;height:24px;display:flex;align-items:center;justify-content:center;color:#8f7bb0;font-size:12px;border-radius:4px;cursor:pointer}
  .tor-winctl span:hover{background:#2f2344}
  .tor-winctl .wx:hover{background:#c0392b;color:#fff}
  .tor-ico-btn{flex:0 0 auto;width:30px;height:30px;border:1px solid #3a2b52;background:#2f2344;color:#c9b8e6;
    border-radius:8px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .tor-ico-btn:hover{background:#3a2b52}
  .tor-addr .oni-ico{color:#c792ff;flex:0 0 auto}
  .tor-addr .circinfo{margin-left:auto;color:#7d6ba0;flex:0 0 auto;cursor:default}
  /* page-load progress bar */
  .tor-progress{flex:0 0 auto;height:2px;overflow:hidden}
  .tor-progress .bar{height:100%;width:0;opacity:0;background:linear-gradient(90deg,#9d5bff,#c792ff);
    box-shadow:0 0 8px #9d5bff;transition:width .3s ease,opacity .35s ease}
  /* loading veil */
  .tor-load{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;height:100%;min-height:280px;color:#8f7bb0}
  .tor-load .spinner{width:34px;height:34px;border:3px solid #3a2b52;border-top-color:#c792ff;border-radius:50%;animation:torspin .8s linear infinite}
  .tor-load .lmsg{font-size:12px}
  /* status bar */
  .tor-status{flex:0 0 auto;height:23px;display:flex;align-items:center;gap:8px;padding:0 12px;
    background:#1a1226;border-top:1px solid #2b2038;color:#7d6ba0;font-size:11px;overflow:hidden;white-space:nowrap}
  .tor-status .conn{color:#9d7bd6}
  /* draggable/floating terminal window + desktop taskbar */
  .crt.floating{position:fixed;margin:0}
  .crt.draggable .bar{cursor:move}
  .taskbar{
    position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:200;
    display:none;gap:6px;padding:7px;background:rgba(20,14,26,.92);
    border:1px solid #3a2b52;border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.55);
    backdrop-filter:blur(10px);
  }
  .taskbar.show{display:flex}
  .taskbar button{
    display:flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;
    color:#c9b8e6;font-family:var(--font);font-size:12px;padding:8px 14px;border-radius:9px;cursor:pointer;
  }
  .taskbar button:hover{background:#2f2344}
  .taskbar button.active{background:#3a2b52;border-color:#6a4fa0;color:#e6d8ff}
  .taskbar .ic{font-size:15px;line-height:1}
</style>
</head>

const COMMANDS=["help","ls","cd","cat","clear","whoami","about","projects","stack",
  "nmap","pgp","sudo","neofetch","ssh","decode","date","echo","banner","gui","github","reboot","exit","logout","open"];
const VAULT_COMMANDS=["help","ls","cd","cat","flag","gpg","decode","msg","tor","whoami","clear","exit","logout"];
function onKey(e){
  const inp=e.target;
  if(e.key==="Enter"){
    if(inputMode==="password"){
      const pw=inp.value;
      freeze("••••••••");
      const cb=onPassword; inputMode="normal"; onPassword=null;
      const r=cb?cb(pw):null;
      if(r&&r.then){ r.then(()=>{ if(inputMode!=="password" && !suppressPrompt) newPrompt(); suppressPrompt=false; }); }
      else if(inputMode!=="password"){ if(!suppressPrompt) newPrompt(); suppressPrompt=false; }
      return;
    }
    const val=inp.value;
    freeze(val);
    run(val.trim());
  } else if(e.key==="ArrowUp"){
    e.preventDefault();
    if(hIndex>0){hIndex--;inp.value=history[hIndex]||"";moveEnd(inp);}
  } else if(e.key==="ArrowDown"){
    e.preventDefault();
    if(hIndex<history.length){hIndex++;inp.value=history[hIndex]||"";moveEnd(inp);}
  } else if(e.key==="Tab"){
    e.preventDefault();
    autocomplete(inp);
  } else if(e.ctrlKey && (e.key==="l"||e.key==="L")){
    e.preventDefault(); doClear();
  } else if(e.ctrlKey && (e.key==="c"||e.key==="C")){
    freeze(inp.value+" ^C"); newPrompt();
  }
}
function moveEnd(inp){const v=inp.value;inp.value="";inp.value=v;}

function poolFor(last){
  // Split into a directory portion (already typed) and the fragment being completed.
  const slash=last.lastIndexOf("/");
  const dirPart=slash>=0?last.slice(0,slash+1):"";   // e.g. "projects/" or "" or "../"
  const dir = dirPart==="" ? cwd : resolveDir(dirPart.replace(/\/$/,""));
  if(!dir || !FS[dir]) return {dirPart, items:[]};
  const items=FS[dir].children.map(c=>{
    const isDir=FS[joinPath(dir,c)]?.type==="dir";
    return dirPart + c + (isDir?"/":"");
  });
  return {dirPart, items};
}
function autocomplete(inp){
  const parts=inp.value.split(/\s+/);
  const cmdList = vaultMode ? VAULT_COMMANDS : COMMANDS;
  if(parts.length<=1){
    const m=cmdList.filter(c=>c.startsWith(parts[0]));
    if(m.length===1){inp.value=m[0]+" ";}
    else if(m.length>1){
      out(m.join("  "),"dim");
      newPrompt();activeInput.value=inp.value;
    }
    return;
  }
  const cmd=parts[0];
  const last=parts[parts.length-1];

  // decode <algo> — complete the algo on the second token
  if(cmd==="decode" && parts.length===2){
    const algos=["base64","sha1","hex","rot13"];
    const m=algos.filter(a=>a.startsWith(last));
    if(m.length===1){ parts[1]=m[0]; inp.value=parts.join(" ")+" "; }
    else if(m.length>1){ parts[1]=commonPrefix(m); const f=parts.join(" "); out(m.join("   "),"dim"); newPrompt(); activeInput.value=f; }
    return;
  }

  // vault mode: complete file/dir arguments against the vault FS + cwd
  if(vaultMode){
    if(!["cat","gpg","open","ls","cd"].includes(cmd)) return;
    // gpg options: complete --decrypt / -d
    if(cmd==="gpg" && last.startsWith("-")){
      const opts=["--decrypt","-d"].filter(o=>o.startsWith(last));
      if(opts.length===1){ parts[parts.length-1]=opts[0]; inp.value=parts.join(" ")+" "; }
      else if(opts.length>1){ out(opts.join("   "),"dim"); newPrompt(); activeInput.value=inp.value; }
      return;
    }
    let items=vaultPool(last);
    if(cmd==="cd") items=items.filter(p=>p.endsWith("/"));   // cd completes directories only
    let m=items.filter(x=>x.startsWith(last));
    if(last.endsWith("/") && m.includes(last)){ const ch=m.filter(x=>x!==last); if(ch.length) m=ch; }
    if(m.length===1){
      parts[parts.length-1]=m[0];
      inp.value=parts.join(" ")+(m[0].endsWith("/")?"":" ");   // dir -> no trailing space
    } else if(m.length>1){
      parts[parts.length-1]=commonPrefix(m);
      const f=parts.join(" "); out(m.join("   "),"dim"); newPrompt(); activeInput.value=f;
    }
    return;
  }

  if(!["cat","cd","open","ls"].includes(cmd)) return;

  let { items } = poolFor(last);
  if(cmd==="cd"){
    // cd completes directories only
    items = items.filter(p=>p.endsWith("/"));
  }
  let m=items.filter(p=>p.startsWith(last));

  // if the user already typed a complete dir path (e.g. "projects/"),
  // drop that exact dir from the shown matches so only its children list
  if(last.endsWith("/") && m.includes(last)){
    const children=m.filter(p=>p!==last);
    if(children.length){ m=children; }
  }

  if(m.length===1){
    // single match: fill it. If it's a dir (ends with /), keep the / and no space
    parts[parts.length-1]=m[0];
    inp.value=parts.join(" ") + (m[0].endsWith("/") ? "" : " ");
  } else if(m.length>1){
    // show candidates, then fill the longest common prefix
    parts[parts.length-1]=commonPrefix(m);
    const filled=parts.join(" ");
    out(m.join("   "),"dim");
    newPrompt();
    activeInput.value=filled;
  }
}
function commonPrefix(arr){
  if(!arr.length) return "";
  let p=arr[0];
  for(const s of arr){
    while(!s.startsWith(p)) p=p.slice(0,-1);
  }
  return p;
}

}

let vcwd="/root";   // vault current directory
function vJoin(dir,seg){ return dir==="/" ? "/"+seg : dir+"/"+seg; }
function vResolve(arg){
  if(!arg) return vcwd;
  const base = arg.startsWith("/") ? "" : vcwd;
  const stack=[];
  for(const p of (base+"/"+arg).split("/")){
    if(p===""||p===".") continue;
    if(p===".."){ stack.pop(); continue; }
    stack.push(p);
  }
  return "/"+stack.join("/");
}
// candidate paths under the fragment being completed (for Tab in the vault)
function vaultPool(last){
  const slash=last.lastIndexOf("/");
  const dirPart=slash>=0?last.slice(0,slash+1):"";
  const dir = dirPart==="" ? vcwd : vResolve(dirPart.replace(/\/$/,""));
  const node=VAULT_FS[dir];
  if(!node||node.type!=="dir") return [];
  return node.children.map(c=>{
    const child=VAULT_FS[vJoin(dir,c)];
    return dirPart + c + (child&&child.type==="dir"?"/":"");
  });
}

${row(title,tcls)}

/* ---------- deep flag: real WebCrypto decrypt (gpg -c symmetric) ---------- */
async function decryptDeep(pw){
  const raw=Uint8Array.from(atob(DEEP_CT),c=>c.charCodeAt(0));
  const salt=raw.slice(0,17), iv=raw.slice(17,29), ct=raw.slice(29);
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt,iterations:100000,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  return new TextDecoder().decode(pt);
}

  bar.addEventListener('mousedown',(e)=>{

    crt.style.left=nx+'px'; crt.style.top=ny+'px';
  });
  window.addEventListener('mouseup',()=>{ dragging=false; });
  // click either window to bring it to the front (desktop-style)
  crt.addEventListener('mousedown',()=>{ if(torActive && winFront!=='term') focusWindow('term'); });

/* ---------- path utils ---------- */
function joinPath(base,seg){
  if(seg.startsWith("~"))return seg;
  if(base==="~")return "~/"+seg;
  return base+"/"+seg;
}
// Resolve an arg (possibly with .. . ~ and multiple segments) to a canonical "~/..." path.
function resolve(arg){
  let parts;
  if(!arg||arg==="~"){ return "~"; }
  if(arg.startsWith("~")){ parts=arg.replace(/^~\/?/,"").split("/"); }
  else { parts=(cwd.replace(/^~\/?/,"")+"/"+arg).split("/"); }
  const stack=[];
  for(const p of parts){
    if(p===""||p===".") continue;
    if(p===".."){ stack.pop(); continue; }
    stack.push(p);
  }
  return stack.length ? "~/"+stack.join("/") : "~";
}
// Convert a canonical "~/..." path to a FILES key (strip leading "~/").
function fileKey(path){ return path.replace(/^~\/?/,""); }
function resolveDir(arg){
  if(!arg)return cwd;
  const p=resolve(arg.replace(/\/$/,""));
  return FS[p]?.type==="dir"?p:null;
}

/* ---------- rich commands ---------- */
function decodeCmd(args){
  const algo=(args[0]||"").toLowerCase();
  const payload=args.slice(1).join("");
  if(!algo){
    out(`usage: decode <algo> <data>
  <span class="amb">base64</span> &lt;blob&gt;   decode a base64 string
  <span class="amb">sha1</span>   &lt;hash&gt;   look a sha1 hash up in the rainbow table
  <span class="amb">hex</span>    &lt;bytes&gt;  decode hex to ascii
  <span class="amb">rot13</span>  &lt;text&gt;   rotate letters by 13`,"dim");
    return;
  }
  if(!payload){ out(`decode: missing data for '${esc(algo)}'`,"red"); return; }

  if(algo==="base64"||algo==="b64"){
    try{
      const dec=decodeURIComponent(escape(atob(payload)));
      out(`<span class="dim">base64 -></span> ${linkify(esc(dec))}`,"acc");
    }catch(e){ out("decode: invalid base64 input","red"); }
    return;
  }
  if(algo==="hex"){
    try{
      const s=payload.replace(/[^0-9a-fA-F]/g,"");
      let out2="";
      for(let i=0;i<s.length;i+=2) out2+=String.fromCharCode(parseInt(s.substr(i,2),16));
      out(`<span class="dim">hex -></span> ${esc(out2)}`,"acc");
    }catch(e){ out("decode: invalid hex input","red"); }
    return;
  }
  if(algo==="rot13"){
    const r=payload.replace(/[a-zA-Z]/g,c=>String.fromCharCode((c<="Z"?90:122)>=(c=c.charCodeAt(0)+13)?c:c-26));
    out(`<span class="dim">rot13 -></span> ${esc(r)}`,"acc");
    return;
  }
  if(algo==="sha1"||algo==="md5"){
    const RAINBOW={ [VAULT_SHA1]:VAULT_PASS };
    const h=payload.toLowerCase();
    if(RAINBOW[h]){
      out(`<span class="dim">cracking hash…</span>`);
      out(`<span class="acc">[+] match found:</span> <span class="amb">${esc(RAINBOW[h])}</span>`,"acc");
    }else{
      out(`<span class="dim">cracking hash…</span>`);
      out(`[-] no match in rainbow table for ${esc(h)}`,"red");
    }
    return;
  }
  out(`decode: unknown algo '${esc(algo)}' — try base64, sha1, hex, rot13`,"red");
}

let guiActive=false;
const PORTFOLIO_URL="portfolio.html?embedded=1";  // same-origin page; ?embedded=1 tells it to skip its own boot
async function guiMode(){
  if(guiActive) return;
  guiActive=true;
  // freeze any live input line so we don't leave a dangling prompt behind the overlay
  if(activeInput) freeze(activeInput.value);
  const crt=document.getElementById('crt');
  const gs=document.getElementById('guiScreen');

  // 1. X-server style boot in the terminal
  const lines=[
    "starting graphical target…",
    "loading display server (Xorg)…",
    "initializing compositor…",
    "mounting /usr/share/y0uls-portfolio…",
    "resolution: auto · switching to fullscreen"
  ];
  for(const l of lines){ out(`<span class="dim">[gui] ${l}</span>`); await sleep(260); }
  await sleep(300);

  // 2. expand the window to fullscreen (CSS transition)
  document.body.classList.add('gui-mode');
  crt.classList.add('fullscreen');
  await sleep(950);

  // 3. loader while the portfolio comes up
  gs.innerHTML=`<div class="gui-boot" id="guiBoot">loading portfolio…</div>`;
  gs.classList.add('show');
  const boot=document.getElementById('guiBoot');
  const frames=["loading portfolio  ","loading portfolio . ","loading portfolio ..","loading portfolio ..."];
  let spinning=true;
  (async()=>{ let i=0; while(spinning){ boot.textContent=frames[i++%frames.length]; await sleep(160);} })();

  // 4. load portfolio.html in a same-origin iframe
  const frame=document.createElement('iframe');
  frame.className="gui-frame";
  frame.src=PORTFOLIO_URL;
  let loaded=false;
  frame.addEventListener('load',()=>{ loaded=true; });
  gs.appendChild(frame);

  // wait for load, or fall back after a timeout (e.g. file missing when running locally)
  const t0=performance.now();
  while(!loaded && performance.now()-t0<4000){ await sleep(100); }
  spinning=false;

  if(loaded){
    frame.classList.add('ready');
    // floating back button over the portfolio
    const back=document.createElement('button');
    back.className="gui-back"; back.id="guiExit";
    back.innerHTML="↩ terminal";
    gs.appendChild(back);
    back.addEventListener('click',()=>exitGui());
    boot.remove();
  }else{
    // fallback: no portfolio.html reachable
    gs.innerHTML=`
      <h1>y0uls</h1>
      <p>Couldn't load <code>portfolio.html</code>. On the live site (github.io) it loads here in fullscreen. For now:</p>
      <div class="gui-actions">
        <a class="gui-btn" href="https://github.com/y0uls" target="_blank" rel="noopener">GitHub</a>
        <a class="gui-btn exit" id="guiExit" href="#">↩ back to terminal</a>
      </div>`;
    document.getElementById('guiExit').addEventListener('click',(e)=>{ e.preventDefault(); exitGui(); });
  }
  suppressPrompt=true;
}

/* right-click = terminal-style copy/paste:
   - if text is selected -> copy it (and clear selection)
   - otherwise -> paste clipboard into the active input at the caret */
screen.addEventListener('contextmenu', async (e)=>{
  e.preventDefault();
  const sel=window.getSelection();
  const selected=sel?sel.toString():"";
  if(selected.length>0){
    try{ await navigator.clipboard.writeText(selected); }catch(err){}
    sel.removeAllRanges();
    if(activeInput) activeInput.focus();
    return;
  }
  // paste
  if(!activeInput) return;
  activeInput.focus();
  let text="";
  try{ text=await navigator.clipboard.readText(); }catch(err){ text=""; }
  if(!text) return;
  const el=activeInput;
  const start=el.selectionStart ?? el.value.length;
  const end=el.selectionEnd ?? el.value.length;
  el.value = el.value.slice(0,start) + text + el.value.slice(end);
  const pos=start+text.length;
  el.setSelectionRange(pos,pos);
});
